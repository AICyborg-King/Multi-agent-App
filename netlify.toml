[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # This specific flag stops Netlify from hanging on 'preparing repo'
  GIT_LFS_SKIP_SMUDGE = "1"
  NETLIFY_LFS_DISABLED = "true"
  # Ensure we can install dependencies without conflicts
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200