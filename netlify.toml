[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # CRITICAL: Skip downloading LFS files during clone to prevent timeouts
  GIT_LFS_SKIP_SMUDGE = "1"
  NETLIFY_LFS_DISABLED = "true"
  # Use legacy peer deps for npm install
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200